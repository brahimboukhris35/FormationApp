
<!-- Gestion des Rôles -->
<section id="role" >
    <h2>Gestion des Rôles</h2>
    <div *ngIf="isSubmittedRole && roleForm.invalid" class="error-message">
        Vous devez remplir tous les champs requis correctement.
    </div>
    <form [formGroup]="roleForm" (ngSubmit)="onSubmitRole()" class="form-container">
        <div class="form-group">
        <input type="text" formControlName="nom" placeholder="Nom du rôle" required [ngClass]="{'error': isSubmittedRole && roleForm.get('nom')?.invalid}" />
        </div>
        <div class="button-group">
        <button class="btn_add" type="submit">
            {{ isEditingRole ? 'Mettre à jour' : 'Ajouter' }}
        </button>
        <button class="btn_cancel" type="button" (click)="resetRoleForm()" *ngIf="isEditingRole">Annuler</button>
        </div>
    </form>
    <table class="roles-table">
        <thead>
        <tr>
            <th>Id</th>
            <th>Nom</th>
            <th style="width: 40px;"></th> <!-- Colonne pour Edit -->
            <th style="width: 40px;"></th> <!-- Colonne pour Delete -->
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let role of roles">
            <td>{{ role.id }}</td>
            <td>{{ role.nom }}</td>
            <td >
            <div class="conpteneur">
                <img src="assets/img/pen.png" alt="Modifier" class="icon-action" (click)="editerRole(role)">
                <span class="content">Modifier</span>
            </div>
            </td>
            <td>
            <div class="conpteneur">
                <img src="assets/img/cross.png" alt="Supprimer" class="icon-action" (click)="supprimerRole(role.id!)">
                <span class="content">Supprimer</span>
            </div>
            </td>
        </tr>
        </tbody>
    </table>
</section>
